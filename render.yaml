services:
  - type: web
    name: hoc-tieng-trung
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
